# ==============================================================================
# Nginx Configuration: Dedicated API Subdomain (e.g. api.yourcompany.com)
# Designed specifically for external clients and customers
# ==============================================================================

# 1. Rate Limiting Zone: Restrict clients to 60 requests/min with burst up to 20
limit_req_zone $binary_remote_addr zone=customer_api_zone:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain or subdomain for your customers
    # For local network / testing: api.darknet.local or your PC's IP
    server_name api.darknet.local 172.19.207.48;

    client_max_body_size 20M;

    # --------------------------------------------------------------------------
    # Security Headers for External Clients
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-API-Key,Authorization" always;

    # Handle CORS Preflight requests for browser-based customer clients
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # --------------------------------------------------------------------------
    # 1. Root / Info Endpoint
    # --------------------------------------------------------------------------
    location = / {
        default_type application/json;
        return 200 '{"service":"Darknet Threat Intelligence API","status":"online","docs_url":"/docs","api_base":"/api/v1"}';
    }

    # --------------------------------------------------------------------------
    # 2. Customer API (v1) - Reverse Proxy to FastAPI Backend
    # --------------------------------------------------------------------------
    location /api/v1/ {
        # Enforce rate-limiting
        limit_req zone=customer_api_zone burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass authentication headers through to FastAPI
        proxy_pass_request_headers on;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header Authorization $http_authorization;

        # Proxy timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Disable buffering for low-latency JSON delivery
        proxy_buffering off;
    }

    # Also route clean /v1/ directly to FastAPI /api/v1/
    location /v1/ {
        limit_req zone=customer_api_zone burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    # --------------------------------------------------------------------------
    # 3. Interactive Documentation (Swagger & OpenAPI)
    # --------------------------------------------------------------------------
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host $host;
    }

    # --------------------------------------------------------------------------
    # 4. Block access to internal Admin/Frontend routes on the API subdomain
    # --------------------------------------------------------------------------
    location /admin {
        return 403 '{"error": "Forbidden", "message": "Admin endpoints are not accessible from the public API subdomain."}';
    }
}
