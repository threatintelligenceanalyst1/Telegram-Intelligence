# ==============================================================================
# Production Nginx Configuration: Direct Public IP & Customer API
# Listens on Port 80 for any Public IP or Hostname (server_name _;)
# ==============================================================================

# Rate limiting zone: max 60 requests/minute per client IP (burst up to 20)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Matches any Public IP address or hostname
    server_name _;

    server_tokens off;
    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS Headers for Customer Integrations
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-API-Key,Authorization" always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # --------------------------------------------------------------------------
    # 1. Customer & Integration API Endpoints (/api/v1/ and /api/)
    # --------------------------------------------------------------------------
    location /api/ {
        # Rate limiting to prevent brute-force abuse
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass Customer API Authentication Headers
        proxy_pass_request_headers on;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Clean /v1/ alias for customers
    location /v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. Interactive Swagger / OpenAPI Documentation
    # --------------------------------------------------------------------------
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host $host;
    }

    # --------------------------------------------------------------------------
    # 3. Realtime WebSockets (Live Telegram Streaming)
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 4. Security Lockdown: Block sensitive server files
    # --------------------------------------------------------------------------
    location ~ /\.(env|git|session|sqlite|db|bak|sh)$ {
        deny all;
        return 404;
    }
}
