# ==============================================================================
# Production Nginx Configuration: Threat Intelligence API
# Domain: api.threatactix.com
# Target Server: Ubuntu Server (VM)
# Upstream Service: FastAPI / Uvicorn (127.0.0.1:8000)
# ==============================================================================

# Rate limiting zone: 60 requests per minute per IP with burst buffer of 20
limit_req_zone $binary_remote_addr zone=threatactix_api_limit:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;

    # Primary API Subdomain
    server_name api.threatactix.com;

    # Security & Protection Headers
    server_tokens off;
    client_max_body_size 25M;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS Headers for Customer Integrations (Allows SIEM, SOAR, & Web Apps)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-API-Key,Authorization" always;

    # Preflight CORS Handler
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # --------------------------------------------------------------------------
    # 1. API Greeting & Health Check
    # --------------------------------------------------------------------------
    location = / {
        default_type application/json;
        return 200 '{"service":"ThreatActix Darknet Threat Intelligence API","status":"online","docs":"https://api.threatactix.com/docs","api_version":"v1"}';
    }

    # --------------------------------------------------------------------------
    # 2. Customer API Endpoints (/api/v1/ and clean /v1/)
    # --------------------------------------------------------------------------
    location /api/v1/ {
        limit_req zone=threatactix_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Customer Authentication Headers
        proxy_pass_request_headers on;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header Authorization $http_authorization;

        # Timeouts for heavy intelligence queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Low-latency streaming JSON delivery
        proxy_buffering off;
    }

    location /v1/ {
        limit_req zone=threatactix_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 3. Interactive Documentation (Swagger UI & OpenAPI)
    # --------------------------------------------------------------------------
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000/redoc;
        proxy_set_header Host $host;
    }

    # --------------------------------------------------------------------------
    # 4. Security Lockdown: Block Internal Admin Endpoints & Sensitive Files
    # --------------------------------------------------------------------------
    location /admin {
        return 403 '{"error": "Forbidden", "message": "Administration routes are restricted to internal networks."}';
    }

    location /api-keys {
        return 403 '{"error": "Forbidden", "message": "API key administration is restricted to internal networks."}';
    }

    # Deny access to sensitive server files
    location ~ /\.(env|git|session|sqlite|db|bak|sh)$ {
        deny all;
        return 404;
    }
}
